<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00bfff;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a017;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00bfff;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017" />
      <stop offset="100%" style="stop-color:#00bfff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#0a0a1a"/>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="250" r="120" fill="#d4a017" opacity="0.08"/>
  <circle cx="350" cy="50" r="100" fill="#00bfff" opacity="0.08"/>
  <!-- Pyramid -->
  <polygon points="200,70 140,150 260,150" fill="none" stroke="#d4a017" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
  <polygon points="200,70 170,150 230,150" fill="#d4a017" opacity="0.1"/>
  <!-- Sun -->
  <circle cx="270" cy="85" r="20" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.5"/>
  <circle cx="270" cy="85" r="20" fill="#ffd700" opacity="0.1"/>
  <line x1="270" y1="58" x2="270" y2="50" stroke="#ffd700" stroke-width="1.5" opacity="0.4"/>
  <line x1="292" y1="68" x2="298" y2="62" stroke="#ffd700" stroke-width="1.5" opacity="0.4"/>
  <line x1="295" y1="85" x2="303" y2="85" stroke="#ffd700" stroke-width="1.5" opacity="0.4"/>
  <!-- Hieroglyph accents -->
  <text x="145" y="170" text-anchor="middle" font-family="serif" font-size="16" fill="#d4a017" opacity="0.4" filter="url(#glow)">𓂀</text>
  <text x="255" y="170" text-anchor="middle" font-family="serif" font-size="16" fill="#00bfff" opacity="0.4" filter="url(#glow)">𓃭</text>
  <!-- Game name -->
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" filter="url(#glow)">Egyptian Dreams</text>
  <!-- Provider badge -->
  <rect x="135" y="220" width="130" height="24" rx="12" fill="#d4a017" opacity="0.2"/>
  <text x="200" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d4a017">Habanero</text>
  <!-- Play button -->
  <circle cx="200" cy="265" r="16" fill="none" stroke="#d4a017" stroke-width="1.5" opacity="0.5"/>
  <polygon points="193,257 193,273 208,265" fill="#d4a017" opacity="0.5"/>
</svg>
