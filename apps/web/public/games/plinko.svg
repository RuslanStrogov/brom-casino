<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35" />
      <stop offset="100%" style="stop-color:#ffcc00" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#0a0a1a"/>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="250" r="120" fill="#ff6b35" opacity="0.08"/>
  <circle cx="350" cy="50" r="100" fill="#ffcc00" opacity="0.08"/>
  <!-- Plinko pegboard -->
  <g transform="translate(200,100)" filter="url(#glow)">
    <!-- Pegs arranged in pyramid -->
    <circle cx="0" cy="-40" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="-25" cy="-15" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="25" cy="-15" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="-50" cy="10" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="0" cy="10" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="50" cy="10" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="-37" cy="35" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="-12" cy="35" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="12" cy="35" r="4" fill="#ff6b35" opacity="0.8"/>
    <circle cx="37" cy="35" r="4" fill="#ff6b35" opacity="0.8"/>
    <!-- Bottom multipliers -->
    <rect x="-70" y="55" width="35" height="18" rx="4" fill="#ffcc00" opacity="0.3"/>
    <text x="-52" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffcc00">10x</text>
    <rect x="-25" y="55" width="35" height="18" rx="4" fill="#ff6b35" opacity="0.3"/>
    <text x="-7" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ff6b35">3x</text>
    <rect x="20" y="55" width="35" height="18" rx="4" fill="#ff6b35" opacity="0.3"/>
    <text x="37" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ff6b35">2x</text>
    <rect x="65" y="55" width="35" height="18" rx="4" fill="#ffcc00" opacity="0.3"/>
    <text x="82" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffcc00">5x</text>
    <!-- Golden ball -->
    <circle cx="-25" cy="-15" r="6" fill="#ffd700" opacity="0.9">
      <animate attributeName="cx" values="-25;-50;-37;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-15;10;35;55" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#glow)">Плинко</text>
  <rect x="155" y="220" width="90" height="24" rx="12" fill="#ff6b35" opacity="0.2"/>
  <text x="200" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ff6b35">In-House</text>
  <circle cx="200" cy="270" r="16" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.5"/>
  <polygon points="193,262 193,278 208,270" fill="#ff6b35" opacity="0.5"/>
</svg>
