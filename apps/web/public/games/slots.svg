<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d95;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2d95;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d95" />
      <stop offset="100%" style="stop-color:#00d4ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="400" height="300" rx="16" fill="#0a0a1a"/>
  <!-- Gradient overlay -->
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <!-- Border -->
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.5"/>
  <!-- Decorative glow circles -->
  <circle cx="50" cy="250" r="120" fill="#ff2d95" opacity="0.08"/>
  <circle cx="350" cy="50" r="100" fill="#00d4ff" opacity="0.08"/>
  <!-- Slot machine reels icon -->
  <g transform="translate(200,125)" filter="url(#glowStrong)">
    <!-- 3 slot reels -->
    <rect x="-65" y="-40" width="40" height="70" rx="6" fill="none" stroke="#ff2d95" stroke-width="2" opacity="0.8"/>
    <text x="-45" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#ff2d95">7</text>
    <rect x="-12" y="-40" width="40" height="70" rx="6" fill="none" stroke="#ff2d95" stroke-width="2" opacity="0.8"/>
    <text x="8" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#ffcc00">🍒</text>
    <rect x="41" y="-40" width="40" height="70" rx="6" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
    <text x="61" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#00d4ff">⭐</text>
  </g>
  <!-- Game name -->
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#glow)">Слоты</text>
  <!-- Provider badge -->
  <rect x="155" y="220" width="90" height="24" rx="12" fill="#ff2d95" opacity="0.2"/>
  <text x="200" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ff2d95">In-House</text>
  <!-- Play button hint -->
  <circle cx="200" cy="270" r="16" fill="none" stroke="#ff2d95" stroke-width="1.5" opacity="0.5"/>
  <polygon points="193,262 193,278 208,270" fill="#ff2d95" opacity="0.5"/>
</svg>
