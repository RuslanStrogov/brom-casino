<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39ff14;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39ff14;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39ff14" />
      <stop offset="100%" style="stop-color:#7b2ff7" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#0a0a1a"/>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="250" r="120" fill="#39ff14" opacity="0.08"/>
  <circle cx="350" cy="50" r="100" fill="#7b2ff7" opacity="0.08"/>
  <!-- Roulette wheel -->
  <g transform="translate(200,125)" filter="url(#glowStrong)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#39ff14" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#7b2ff7" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#39ff14" stroke-width="1" opacity="0.3"/>
    <!-- Number sectors -->
    <g opacity="0.7">
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#ff2d95" stroke-width="1"/>
      <line x1="0" y1="0" x2="20" y2="-35" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="0" x2="-20" y2="-35" stroke="#ff2d95" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="0" x2="35" y2="-20" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="0" x2="35" y2="20" stroke="#ff2d95" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="0" x2="20" y2="35" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="0" x2="-20" y2="35" stroke="#ff2d95" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="0" x2="-35" y2="20" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="0" x2="-35" y2="-20" stroke="#ff2d95" stroke-width="0.8" opacity="0.5"/>
    </g>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6" fill="#39ff14" opacity="0.8"/>
    <!-- Ball -->
    <circle cx="28" cy="28" r="5" fill="#ffffff" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#glow)">Рулетка</text>
  <rect x="150" y="225" width="100" height="24" rx="12" fill="#39ff14" opacity="0.2"/>
  <text x="200" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#39ff14">In-House</text>
  <circle cx="200" cy="275" r="16" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.5"/>
  <polygon points="193,267 193,283 208,275" fill="#39ff14" opacity="0.5"/>
</svg>
