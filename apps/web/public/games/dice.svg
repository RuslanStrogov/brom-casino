<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff" />
      <stop offset="100%" style="stop-color:#7b2ff7" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#0a0a1a"/>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="250" r="120" fill="#00d4ff" opacity="0.08"/>
  <circle cx="350" cy="50" r="100" fill="#7b2ff7" opacity="0.08"/>
  <!-- Two dice -->
  <g transform="translate(200,120)" filter="url(#glowStrong)">
    <!-- Left dice -->
    <rect x="-55" y="-35" width="50" height="50" rx="8" fill="#0a0a1a" stroke="#00d4ff" stroke-width="2" opacity="0.9"/>
    <circle cx="-42" cy="-22" r="4" fill="#00d4ff"/>
    <circle cx="-42" cy="-8" r="4" fill="#00d4ff"/>
    <circle cx="-42" cy="6" r="4" fill="#00d4ff"/>
    <circle cx="-28" cy="-22" r="4" fill="#00d4ff"/>
    <circle cx="-28" cy="-8" r="4" fill="#00d4ff"/>
    <circle cx="-28" cy="6" r="4" fill="#00d4ff"/>
    <!-- Right dice -->
    <rect x="15" y="-35" width="50" height="50" rx="8" fill="#0a0a1a" stroke="#7b2ff7" stroke-width="2" opacity="0.9"/>
    <circle cx="28" cy="-8" r="4" fill="#7b2ff7"/>
    <circle cx="40" cy="-8" r="4" fill="#7b2ff7"/>
  </g>
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#glow)">Кости</text>
  <rect x="155" y="220" width="90" height="24" rx="12" fill="#00d4ff" opacity="0.2"/>
  <text x="200" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#00d4ff">In-House</text>
  <circle cx="200" cy="270" r="16" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <polygon points="193,262 193,278 208,270" fill="#00d4ff" opacity="0.5"/>
</svg>
