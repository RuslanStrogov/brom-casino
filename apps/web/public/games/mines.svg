<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#222222;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#222222;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444" />
      <stop offset="100%" style="stop-color:#666666" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#0a0a1a"/>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="250" r="120" fill="#ff4444" opacity="0.08"/>
  <circle cx="350" cy="50" r="100" fill="#333333" opacity="0.08"/>
  <!-- Mine icon -->
  <circle cx="200" cy="115" r="30" fill="none" stroke="#ff4444" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>
  <line x1="175" y1="100" x2="185" y2="110" stroke="#ff4444" stroke-width="2" opacity="0.5"/>
  <line x1="225" y1="100" x2="215" y2="110" stroke="#ff4444" stroke-width="2" opacity="0.5"/>
  <line x1="175" y1="130" x2="185" y2="120" stroke="#ff4444" stroke-width="2" opacity="0.5"/>
  <line x1="225" y1="130" x2="215" y2="120" stroke="#ff4444" stroke-width="2" opacity="0.5"/>
  <line x1="190" y1="90" x2="195" y2="105" stroke="#ff4444" stroke-width="1.5" opacity="0.3"/>
  <line x1="210" y1="90" x2="205" y2="105" stroke="#ff4444" stroke-width="1.5" opacity="0.3"/>
  <line x1="190" y1="140" x2="195" y2="125" stroke="#ff4444" stroke-width="1.5" opacity="0.3"/>
  <line x1="210" y1="140" x2="205" y2="125" stroke="#ff4444" stroke-width="1.5" opacity="0.3"/>
  <!-- 💎 -->
  <text x="200" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff4444" opacity="0.7" filter="url(#glow)">💥</text>
  <!-- Game name -->
  <text x="200" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#glow)">Mines</text>
  <!-- Provider badge -->
  <rect x="145" y="210" width="110" height="24" rx="12" fill="#ff4444" opacity="0.2"/>
  <text x="200" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ff4444">Spribe</text>
  <!-- Play button -->
  <circle cx="200" cy="260" r="16" fill="none" stroke="#ff4444" stroke-width="1.5" opacity="0.5"/>
  <polygon points="193,252 193,268 208,260" fill="#ff4444" opacity="0.5"/>
</svg>
