<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd60a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff2d95;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd60a;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ff2d95;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd60a" />
      <stop offset="100%" style="stop-color:#ff2d95" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="#0a0a1a"/>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="url(#border)" stroke-width="0.5" opacity="0.5"/>
  <circle cx="50" cy="250" r="120" fill="#ffd60a" opacity="0.08"/>
  <circle cx="350" cy="50" r="100" fill="#ff2d95" opacity="0.08"/>
  <!-- Two playing cards -->
  <g transform="translate(200,120)" filter="url(#glowStrong)">
    <!-- Left card - Ace -->
    <rect x="-45" y="-40" width="35" height="55" rx="4" fill="#0a0a1a" stroke="#ffd60a" stroke-width="1.5" opacity="0.9"/>
    <text x="-27" y="-18" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffd60a">A</text>
    <circle cx="-27" cy="2" r="4" fill="none" stroke="#ffd60a" stroke-width="1" opacity="0.5"/>
    <!-- Right card - King -->
    <rect x="-2" y="-40" width="35" height="55" rx="4" fill="#0a0a1a" stroke="#ff2d95" stroke-width="1.5" opacity="0.9"/>
    <text x="15" y="-18" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ff2d95">K</text>
    <!-- Card suit symbols -->
    <text x="-27" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffd60a">♠</text>
    <text x="15" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff2d95">♥</text>
  </g>
  <!-- Chips -->
  <g transform="translate(200,160)" filter="url(#glow)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#39ff14" stroke-width="3" opacity="0.5"/>
    <circle cx="15" cy="-5" r="8" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
    <circle cx="-15" cy="-3" r="8" fill="none" stroke="#ffd60a" stroke-width="2" opacity="0.4"/>
  </g>
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#glow)">Блэкджек</text>
  <rect x="147" y="225" width="106" height="24" rx="12" fill="#ffd60a" opacity="0.2"/>
  <text x="200" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffd60a">In-House</text>
  <circle cx="200" cy="275" r="16" fill="none" stroke="#ffd60a" stroke-width="1.5" opacity="0.5"/>
  <polygon points="193,267 193,283 208,275" fill="#ffd60a" opacity="0.5"/>
</svg>
