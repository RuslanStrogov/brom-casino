version: '3.8'

services:
  # ===== Database =====
  postgres:
    image: postgres:16-alpine
    container_name: brom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brom_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-brom_casino}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Cache / Queue =====
  redis:
    image: redis:7-alpine
    container_name: brom-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_2026}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Analytics =====
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: brom-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-brom_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-brom}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret_2026}

  # ===== API Backend =====
  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: brom-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-brom}:${POSTGRES_PASSWORD:-brom_secret_2026}@postgres:5432/${POSTGRES_DB:-brom_casino}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== Web Frontend =====
  web:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: brom-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost:4000}
    depends_on:
      - api

  # ===== Admin Panel =====
  admin:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.admin
    container_name: brom-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    depends_on:
      - api

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: brom-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - web
      - admin

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
