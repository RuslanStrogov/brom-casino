name: casino
services:
  # ===== Database =====
  postgres:
    image: postgres:16-alpine
    container_name: casino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-casino}
    ports:
      - "127.0.0.1:5433:5432"  # 5432 занят? нет, на хосте нет. 5433 для изоляции
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casino}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Cache / Queue =====
  redis:
    image: redis:7-alpine
    container_name: casino-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"  # 6379 занят хост-редисом
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Analytics =====
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: casino-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8124:8123"  # 8123 занят
      - "127.0.0.1:9001:9000"  # 9000 занят
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-casino_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-casino}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

  # ===== API Backend =====
  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: casino-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-casino}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-casino}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      API_PORT: "4000"
      WEB_URL: https://cas.br-design.ru
      ADMIN_URL: https://casino.strogov.com
      NEXT_PUBLIC_API_URL: https://casino.strogov.com/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== Web Frontend =====
  web:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: casino-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"  # 3000 занят super-ai-ru
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://casino.strogov.com/api
      NEXT_PUBLIC_WS_URL: wss://casino.strogov.com/api
    depends_on:
      - api

  # ===== Admin Panel =====
  admin:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.admin
    container_name: casino-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://casino.strogov.com/api
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
